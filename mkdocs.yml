site_name: 柔顺对接仿真文档
site_description: MuJoCo × Pinocchio 机械臂柔顺对接与装配仿真研究仓库
site_url: https://langxin11.github.io/compliant_docking_simulation/
repo_url: https://github.com/langxin11/compliant_docking_simulation
repo_name: langxin11/compliant_docking_simulation
# Local research drafts are maintained separately from the published manual.
exclude_docs: |
  /reports/research_draft/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: default

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - docs/_repository_reports.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
            members_order: source
            group_by_category: true
            show_category_heading: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 50
            annotations_path: brief

nav:
  - 首页: index.md

  - 项目与研究:
      - 项目演化: project_evolution.md
      - 研究组织与范围: research_scope.md

  - 理论基础:
      - 阻抗控制: theory/impedance_control.md
      - SE(3) Lie 阻抗: theory/se3_lie_impedance.md
      - 仿真理论与数据流: theory/simulation_flow.md

  - 三层结构:
      - 模型与接口: models_interfaces.md
      - 接触阶段控制实验: control_research.md
      - 接触刚度实验结果: control_main_results.md
      - 完整系统验证: system_validation.md

  - 实验复现: experiments.md
  - HexFrame 正式组装: hexframe_assembly.md
  - 接口交互调形: petal_designer.md
  - 论文与代码来源: paper_mapping.md
  - 历史证据索引: historical_evidence.md
  - 架构总览: architecture.md
  - 完善方案与组合对接: development_plan.md
  - 代码与注释规范: coding_style.md
  - API 参考:
      - 控制器与力学工具: api/control.md
      - 轨迹与运动参考: api/planning.md
      - 核心模块: api/core.md
