site_name: 柔顺对接仿真文档
site_description: MuJoCo × Pinocchio 柔顺对接研究平台——经典阻抗、SE(3) Lie 群阻抗、HQP-AC 与 SE(3)-TOPP
site_url: https://langxin11.github.io/compliant_docking_simulation/
repo_url: https://github.com/langxin11/compliant_docking_simulation
repo_name: langxin11/compliant_docking_simulation
site_dir: runs/docs_site
# Local research drafts are maintained separately from the published manual.
exclude_docs: |
  /reports/research_draft/

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: default

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - docs/_repository_reports.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
            members_order: source
            group_by_category: true
            show_category_heading: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 50
            annotations_path: brief

nav:
  - 首页: index.md
  - 三层研究:
      - 新对话交接: handoff_20261004.md
      - 当前主线与停止条件: research_focus.md
      - 范围与依赖: research_scope.md
      - 收束与数据清理: research_cleanup_20261004.md
      - 模型与接口: models_interfaces.md
      - 控制研究协议: control_research.md
      - 控制主结果与集成选择: control_main_results.md
      - 系统验证与 Demo: system_validation.md
      - 分层实验入口: experiment_entrypoints.md
      - 历史证据索引: historical_evidence.md
      - 迁移验证记录: restructuring_validation.md
      - 目录归档与清理: directory_cleanup.md
      - 生成数据与忽略规则: generated_artifacts.md
      - 原始重构计划（草案）: restructuring_plan.md
  - 架构总览: architecture.md
  - 代码与注释规范: coding_style.md
  - GLM 编码接入: glm_bridge.md
  - 论文-代码对照: paper_mapping.md
  - 理论:
      - 阻抗控制基础: theory/impedance_control.md
      - SE(3) Lie 群阻抗控制器: theory/se3_lie_impedance.md
      - 主仿真理论与数据流: theory/simulation_flow.md
  - 实验复现手册: experiments.md
  - 接口交互调形: petal_designer.md
  - 接口阶段收尾: stage_closeout_20261003.md
  - 本地 Git 阶段整理: git_stage_closeout_20261003.md
  - HexFrame 正式组装场景: hexframe_assembly.md
  - 完善方案与组合对接: development_plan.md
  - API 参考:
      - 控制器与力学工具: api/control.md
      - 轨迹与运动参考: api/planning.md
      - 核心模块: api/core.md
