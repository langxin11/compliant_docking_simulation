site_name: 柔顺对接仿真文档
site_description: MuJoCo × Pinocchio 柔顺对接研究平台——经典阻抗、SE(3) Lie 群阻抗、HQP-AC 与 SE(3)-TOPP
site_url: https://langxin11.github.io/compliant_docking_simulation/
repo_url: https://github.com/langxin11/compliant_docking_simulation
repo_name: langxin11/compliant_docking_simulation

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: default

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
            members_order: source
            group_by_category: true
            show_category_heading: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 50
            annotations_path: brief

nav:
  - 首页: index.md
  - 架构总览: architecture.md
  - 论文-代码对照: paper_mapping.md
  - 理论:
      - 阻抗控制基础: theory/impedance_control.md
      - SE(3) Lie 群阻抗控制器: theory/se3_lie_impedance.md
      - 主仿真理论与数据流: theory/simulation_flow.md
  - 实验复现手册: experiments.md
  - API 参考:
      - 控制器与力学工具: api/control.md
      - 轨迹与运动参考: api/planning.md
      - 核心模块: api/core.md
