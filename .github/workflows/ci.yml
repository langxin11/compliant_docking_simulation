name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install EGL libraries for headless MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # 慢速接触回归（-m slow）耗时较长，不在免费 runner 的 CI 中运行 /
      # The slow contact regression (-m slow) is too slow for free CI runners
      - name: Run fast tests
        run: uv run pytest -m "not slow" -q
