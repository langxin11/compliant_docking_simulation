name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install EGL libraries for headless MuJoCo
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # 慢速接触回归（-m slow）耗时较长，不在免费 runner 的 CI 中运行 /
      # The slow contact regression (-m slow) is too slow for free CI runners
      - name: Run fast tests
        run: uv run pytest -m "not slow" -q

      - name: Full HexFrame assembly and independent audit
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: uv run docking --scene scenes/hexframe_assembly.yaml --out runs/ci_hexframe_assembly

      - name: Preserve HexFrame diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hexframe-assembly-diagnostics
          path: runs/ci_hexframe_assembly
