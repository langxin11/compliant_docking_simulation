# 对接场景：FR3 + 公头锥 + 母头锥。机械臂资产由 mujoco_menagerie franka_fr3
# 派生（assets/fr3/fr3_arm.xml：力矩执行器变体，Pinocchio 经 MJCF 直读）。
# 接口与 iiwa14 场景同款（花冠公头 male_cone + 花冠母头 female_socket）。
# FR3 保留上游真实减速器摩擦（fr3_arm.xml：joints1-4 1.137 N·m 等），
# 控制器由 run_docking 传入组装模型 dof_frictionloss 做前馈补偿
# （τ_ff = frictionloss·tanh(q̇/0.01)），无补偿时摩擦会产生 ~16cm
# 跟踪滞后导致无法入扣。
scene:
  name: fr3_docking

robot:
  mjcf: assets/fr3/fr3_arm.xml
  pin_model: assets/fr3/fr3_arm.xml      # MJCF 直读（load_pin_model 按后缀分发）
  ee_site: attachment_site
  ee_frame: attachment_site

tool:
  mjcf: assets/interfaces/male_cone.xml         # 花冠公头（与 iiwa14 场景同款接口片段）
  prefix: tool_
  pose: {pos: [0.0, 0.0, 0.015], quat: [1.0, 0.0, 0.0, 0.0]}
  # Pinocchio 的 FR3 基模型不含运行时 attach 的工具；数值与 male_cone.xml 完全一致。
  pin_inertia: {mass: 1.0, com: [0.0, 0.0, 0.0], diaginertia: [0.1, 0.1, 0.1]}

target:
  mjcf: assets/interfaces/female_socket.xml     # 花冠母头（与 iiwa14 场景同款接口片段）
  prefix: target_
  pos: [0.0, 0.5, 0.35]
  quat: [1.0, 0.0, 0.0, 0.0]

physics:
  timestep: 0.001
  gravity: [0.0, 0.0, 0.0]
  integrator: implicitfast
  cone: elliptic
  sdf_iterations: 10
  sdf_initpoints: 40

impedance:                                # FR3 真实摩擦下的刚度覆盖（静摩擦死区 ∝ 1/k）
  k: 300.0
  d: 100.0

task:
  init_pos: [0.0, 0.5, 0.5]
  init_ori: [[1, 0, 0], [0, -1, 0], [0, 0, -1]]
  ik_guess: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]  # FR3 home 位形
  stroke: [0.0, 0.0, -0.10]  # 期望终点略越过接触点（root≈0.398），预紧主要由摩擦 I 项提供（约 5-8N）
