[project]
name = "compliant-docking"
version = "0.2.0"
description = "KUKA iiwa14 柔顺对接仿真：MuJoCo 物理仿真 × Pinocchio 动力学联动"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "pin",
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
