[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliant-docking"
version = "0.2.0"
description = "KUKA iiwa14 柔顺对接仿真：MuJoCo 物理仿真 × Pinocchio 动力学联动"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "pin",
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
docking = "compliant_docking.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/compliant_docking"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long physics regression runs",
]
