[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compliant-docking"
version = "0.2.0"
description = "七自由度机械臂柔顺对接仿真：MuJoCo 物理仿真 × Pinocchio 动力学与多控制器研究"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "pin",
    "numpy",
    "scipy",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
    "pyyaml>=6.0.3",
    "proxsuite>=0.7.3",
    "scienceplots>=2.1",
]

[dependency-groups]
geometry = ["coacd==1.0.14"]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pytest",
    "ruff",
]

[project.scripts]
docking = "compliant_docking.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/compliant_docking"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Keep imported upstream sources and immutable experiment provenance untouched.
extend-exclude = [
    "runs",
    "assets/modules/hexframe",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "archive/orbital_showcase/test_hexframe_integration.py",
    "archive/orbital_showcase/contact_force_study",
    "archive/orbital_showcase/crown_seating",
]
markers = [
    "slow: long physics regression runs",
]
